<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tetress — game viewer</title>
<style>
  :root {
    --bg: #0F1419;
    --panel: #161C26;
    --grid-line: #1F2733;
    --empty: #161C26;
    --red: #EF4444;
    --red-glow: #F87171;
    --blue: #3B82F6;
    --blue-glow: #60A5FA;
    --text: #E5E7EB;
    --dim: #9CA3AF;
    --accent: #FCD34D;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    box-sizing: border-box;
  }
  h1 {
    letter-spacing: 4px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 24px;
  }
  .board-wrap {
    position: relative;
  }
  svg.board {
    display: block;
    border-radius: 16px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
  }
  .controls {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--grid-line);
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  button:hover { background: #1d2531; }
  button:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--accent);
    color: #1a1306;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { background: #f6c43a; }
  input[type=range] {
    accent-color: var(--accent);
    width: 280px;
  }
  .meta {
    color: var(--dim);
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
  }
  .legend {
    display: flex;
    gap: 18px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--dim);
    align-items: center;
  }
  .swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 4px;
    vertical-align: middle;
    margin-right: 6px;
  }
  .swatch.red { background: var(--red); }
  .swatch.blue { background: var(--blue); }
  .error {
    color: #FCA5A5;
    background: #2A1313;
    border: 1px solid #5B1F1F;
    border-radius: 8px;
    padding: 16px 20px;
    max-width: 520px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
  }
  code { background: #1F2733; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h1>TETRESS</h1>
  <div class="subtitle">INTERACTIVE GAME VIEWER</div>

  <div id="board-host" class="board-wrap"></div>

  <div class="controls">
    <button id="restart" title="Restart">⏮︎ Restart</button>
    <button id="step-back" title="Step back">◀︎</button>
    <button id="play" class="primary" title="Play / Pause">▶︎ Play</button>
    <button id="step-fwd" title="Step forward">▶︎</button>
    <button id="end" title="Jump to end">⏭︎ End</button>
    <input id="scrub" type="range" min="0" value="0" />
  </div>

  <div class="meta" id="status">Loading game…</div>
  <div class="legend">
    <span><span class="swatch red"></span>Final agent (RED)</span>
    <span><span class="swatch blue"></span>Random baseline (BLUE)</span>
  </div>

<script>
(async function () {
  const host = document.getElementById("board-host");
  const status = document.getElementById("status");
  const scrub = document.getElementById("scrub");
  const playBtn = document.getElementById("play");

  let game;
  try {
    const res = await fetch("game.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`fetch failed: HTTP ${res.status}`);
    game = await res.json();
  } catch (err) {
    host.innerHTML = `<div class="error">Couldn't load <code>game.json</code>.<br/>Run <code>python3 viz/record_game.py</code> from the repo root, then open this file via a local server (eg. <code>python3 -m http.server</code> in the <code>viz/</code> directory).<br/><br/><small>${err.message}</small></div>`;
    status.textContent = "";
    return;
  }

  const N = game.board_n;
  const frames = game.frames;
  scrub.max = String(frames.length - 1);

  // Layout — matches viz/render.py exactly so the viewer looks like the GIF.
  const CELL = 40, GAP = 2, GRID_PAD = 14, MARGIN_X = 24, HEADER_H = 88, FOOTER_H = 16;
  const GRID_PX = N * CELL + (N - 1) * GAP;
  const WIDTH = MARGIN_X * 2 + GRID_PAD * 2 + GRID_PX;
  const HEIGHT = HEADER_H + GRID_PAD * 2 + GRID_PX + FOOTER_H;

  function cellXY(r, c) {
    return [MARGIN_X + GRID_PAD + c * (CELL + GAP), HEADER_H + GRID_PAD + r * (CELL + GAP)];
  }

  const SVG_NS = "http://www.w3.org/2000/svg";
  function el(name, attrs = {}, children = []) {
    const node = document.createElementNS(SVG_NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    for (const c of children) node.appendChild(c);
    return node;
  }

  function buildBoard() {
    const svg = el("svg", {
      class: "board",
      xmlns: SVG_NS,
      viewBox: `0 0 ${WIDTH} ${HEIGHT}`,
      width: WIDTH,
      height: HEIGHT,
    });
    // defs + static chrome
    svg.innerHTML = `
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F87171"/><stop offset="100%" stop-color="#EF4444"/>
        </linearGradient>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
      </defs>
      <rect width="${WIDTH}" height="${HEIGHT}" fill="#0F1419"/>
      <text x="${MARGIN_X}" y="40" fill="#E5E7EB" font-size="22" font-weight="700" letter-spacing="3">TETRESS</text>
      <text id="turn-label" x="${MARGIN_X}" y="62" fill="#9CA3AF" font-size="12" letter-spacing="1">TURN   0</text>
      <rect x="${MARGIN_X}" y="${HEADER_H}" width="${WIDTH - 2 * MARGIN_X}" height="${GRID_PAD * 2 + GRID_PX}" rx="12" fill="#161C26"/>
      <rect x="${MARGIN_X + 4}" y="${HEADER_H + 4}" width="${WIDTH - 2 * MARGIN_X - 8}" height="${GRID_PAD * 2 + GRID_PX - 8}" rx="10" fill="none" stroke="#1F2733" stroke-width="1" stroke-dasharray="4 4"/>
    `;
    // Cell layer.
    const layer = el("g", { id: "cells" });
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const [x, y] = cellXY(r, c);
        layer.appendChild(el("rect", {
          id: `cell-${r}-${c}`,
          x, y, width: CELL, height: CELL, rx: 6,
          fill: "#161C26", stroke: "#1F2733", "stroke-width": 1,
        }));
      }
    }
    svg.appendChild(layer);

    // Score badges (built after cells so they paint on top).
    const badgeY = 30, badgeH = 40, badgeW = 70;
    const rx = WIDTH - MARGIN_X - badgeW;
    const bx = rx - badgeW - 8;
    svg.insertAdjacentHTML("beforeend", `
      <g>
        <rect x="${bx}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="8" fill="#161C26"/>
        <circle cx="${bx + 14}" cy="${badgeY + badgeH/2}" r="6" fill="url(#blueGrad)"/>
        <text id="blue-count" x="${bx + 28}" y="${badgeY + 26}" fill="#E5E7EB" font-size="16" font-weight="600">0</text>
        <rect x="${rx}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="8" fill="#161C26"/>
        <circle cx="${rx + 14}" cy="${badgeY + badgeH/2}" r="6" fill="url(#redGrad)"/>
        <text id="red-count" x="${rx + 28}" y="${badgeY + 26}" fill="#E5E7EB" font-size="16" font-weight="600">0</text>
      </g>
      <text id="caption" x="${MARGIN_X}" y="${HEIGHT - 4}" fill="#9CA3AF" font-size="11"></text>
    `);

    return svg;
  }

  const svg = buildBoard();
  host.appendChild(svg);

  function describeLane(cells) {
    if (!cells || !cells.length) return "A line";
    const rowCounts = new Map();
    const colCounts = new Map();
    for (const [r, c] of cells) {
      rowCounts.set(r, (rowCounts.get(r) || 0) + 1);
      colCounts.set(c, (colCounts.get(c) || 0) + 1);
    }
    const fullRows = [...rowCounts.entries()].filter(([, n]) => n === N).map(([r]) => r).sort((a, b) => a - b);
    const fullCols = [...colCounts.entries()].filter(([, n]) => n === N).map(([c]) => c).sort((a, b) => a - b);
    const bits = [];
    if (fullRows.length) bits.push("Row " + fullRows.join(" + "));
    if (fullCols.length) bits.push("Column " + fullCols.join(" + "));
    return bits.length ? bits.join(" + ") : "A line";
  }

  function paint(idx) {
    const f = frames[idx];
    const occupied = new Map();
    for (const cell of f.board) occupied.set(`${cell.r}-${cell.c}`, cell.color);
    const lastSet = new Set((f.last_move || []).map(([r, c]) => `${r}-${c}`));
    const doomedSet = new Set((f.about_to_clear || []).map(([r, c]) => `${r}-${c}`));

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const node = document.getElementById(`cell-${r}-${c}`);
        const key = `${r}-${c}`;
        const colour = occupied.get(key);
        node.removeAttribute("filter");
        node.removeAttribute("stroke-width");
        if (colour === "R") {
          node.setAttribute("fill", "url(#redGrad)");
          node.setAttribute("stroke", "none");
        } else if (colour === "B") {
          node.setAttribute("fill", "url(#blueGrad)");
          node.setAttribute("stroke", "none");
        } else {
          node.setAttribute("fill", "#161C26");
          node.setAttribute("stroke", "#1F2733");
          node.setAttribute("stroke-width", 1);
        }
        if (doomedSet.has(key) && colour) {
          node.setAttribute("filter", "url(#glow)");
          node.setAttribute("stroke", "#FCD34D");
          node.setAttribute("stroke-width", 2.5);
        } else if (lastSet.has(key) && colour) {
          node.setAttribute("filter", "url(#glow)");
          node.setAttribute("stroke", "#FCD34D");
          node.setAttribute("stroke-width", 1.5);
        }
      }
    }
    document.getElementById("turn-label").textContent = `TURN ${String(f.turn).padStart(3, " ")}`;
    document.getElementById("red-count").textContent = f.red_count;
    document.getElementById("blue-count").textContent = f.blue_count;
    let caption = "";
    const captionNode = document.getElementById("caption");
    if (f.about_to_clear && f.about_to_clear.length) {
      caption = `${describeLane(f.about_to_clear)} fills up — clearing ${f.about_to_clear.length} cells next`;
      captionNode.setAttribute("fill", "#FCD34D");
      captionNode.setAttribute("font-weight", "600");
    } else {
      captionNode.setAttribute("fill", "#9CA3AF");
      captionNode.setAttribute("font-weight", "400");
      if (f.last_color && f.last_move) {
        const who = f.last_color === "R" ? "RED" : "BLUE";
        caption = `${who} placed a tetromino`;
        if (f.cleared && f.cleared.length) caption += `  ·  cleared ${f.cleared.length} cells`;
      }
    }
    captionNode.textContent = caption;
    scrub.value = String(idx);
    status.textContent = `Frame ${idx + 1} / ${frames.length}`;
  }

  let cursor = 0;
  let timer = null;
  const FRAME_MS = 320;

  function play() {
    if (timer) return;
    if (cursor >= frames.length - 1) cursor = 0;
    playBtn.textContent = "❚❚ Pause";
    timer = setInterval(() => {
      cursor++;
      if (cursor >= frames.length) {
        cursor = frames.length - 1;
        pause();
      }
      paint(cursor);
    }, FRAME_MS);
  }
  function pause() {
    if (timer) { clearInterval(timer); timer = null; }
    playBtn.textContent = "▶︎ Play";
  }
  function toggle() { timer ? pause() : play(); }

  playBtn.addEventListener("click", toggle);
  document.getElementById("step-fwd").addEventListener("click", () => {
    pause();
    cursor = Math.min(cursor + 1, frames.length - 1);
    paint(cursor);
  });
  document.getElementById("step-back").addEventListener("click", () => {
    pause();
    cursor = Math.max(cursor - 1, 0);
    paint(cursor);
  });
  document.getElementById("restart").addEventListener("click", () => {
    pause();
    cursor = 0;
    paint(cursor);
  });
  document.getElementById("end").addEventListener("click", () => {
    pause();
    cursor = frames.length - 1;
    paint(cursor);
  });
  scrub.addEventListener("input", (e) => {
    pause();
    cursor = Number(e.target.value);
    paint(cursor);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowRight") { pause(); cursor = Math.min(cursor + 1, frames.length - 1); paint(cursor); }
    else if (e.key === "ArrowLeft")  { pause(); cursor = Math.max(cursor - 1, 0); paint(cursor); }
  });

  paint(0);
})();
</script>
</body>
</html>
